<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta
      id="viewport"
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <script>
      if (
        /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)
      ) {
        document.getElementById('viewport').content += ', maximum-scale=1'
      }
    </script>
    <meta name="theme-color" content="#F2EBF2" />
    <meta name="description" content="음악으로 연결되는 TUNEET" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TUNEET" />
    <!-- 폰트(HiKR·손글씨)를 받는 CDN에 미리 연결해 둔다 -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- 앨범 커버는 coverartarchive.org → archive.org 로 두 번 이동해서 받는다. 미리 연결해 이동 시간을 줄인다 -->
    <link rel="preconnect" href="https://coverartarchive.org" />
    <link rel="preconnect" href="https://archive.org" />
    <title>TUNEET</title>
    <style>
      html,
      body {
        margin: 0;
        background-color: #f2ebf2;
      }

      @media (min-width: 768px) {
        html,
        body {
          background-color: #2e2e2e;
        }
      }

      .static-intro {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="static-intro">
        <h1>TUNEET</h1>
        <p>
          좋아하는 장르·아티스트·노래로 음악 프로필을 만들고, 취향이 비슷한 사람을 추천받아 편지를
          주고받는 음악 취향 소셜 서비스입니다.
        </p>
        <p>
          TUNEET is a music-taste social app. Optionally connect YouTube Music to import your liked
          songs (read-only) into your music profile.
        </p>
        <p>
          <a href="/privacy">개인정보 처리방침 (Privacy Policy)</a> ·
          <a href="/terms">서비스 이용약관 (Terms of Service)</a>
        </p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
